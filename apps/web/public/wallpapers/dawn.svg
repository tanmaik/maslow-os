<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2233"/>
      <stop offset="0.4" stop-color="#6c4352"/>
      <stop offset="0.72" stop-color="#c07a5f"/>
      <stop offset="1" stop-color="#f0b483"/>
    </linearGradient>
    <radialGradient id="l0" cx="0.72" cy="0.82" r="0.55">
      <stop offset="0" stop-color="#ffe1b0" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffe1b0" stop-opacity="0.193"/>
      <stop offset="1" stop-color="#ffe1b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="l1" cx="0.12" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#8a6a9a" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#8a6a9a" stop-opacity="0.105"/>
      <stop offset="1" stop-color="#8a6a9a" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="grain" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" filter="url(#noise)"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#l0)"/>
  <rect width="1600" height="1000" fill="url(#l1)"/>
  <rect width="1600" height="1000" fill="url(#grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
