<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0c0b"/>
      <stop offset="0.55" stop-color="#1d1512"/>
      <stop offset="1" stop-color="#42210f"/>
    </linearGradient>
    <radialGradient id="l0" cx="0.5" cy="1.02" r="0.75">
      <stop offset="0" stop-color="#e4711f" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#e4711f" stop-opacity="0.193"/>
      <stop offset="1" stop-color="#e4711f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="l1" cx="0.18" cy="0.12" r="0.45">
      <stop offset="0" stop-color="#4a2c1a" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#4a2c1a" stop-opacity="0.175"/>
      <stop offset="1" stop-color="#4a2c1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="grain" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" filter="url(#noise)"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#l0)"/>
  <rect width="1600" height="1000" fill="url(#l1)"/>
  <rect width="1600" height="1000" fill="url(#grain)" opacity="0.09" style="mix-blend-mode:overlay"/>
</svg>
