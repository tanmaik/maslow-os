<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfae8c"/>
      <stop offset="0.35" stop-color="#e3c9a8"/>
      <stop offset="1" stop-color="#f2e2cc"/>
    </linearGradient>
    <radialGradient id="l0" cx="0.78" cy="0.24" r="0.6">
      <stop offset="0" stop-color="#fff4e2" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#fff4e2" stop-opacity="0.245"/>
      <stop offset="1" stop-color="#fff4e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="l1" cx="0.1" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#b08b64" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#b08b64" stop-opacity="0.122"/>
      <stop offset="1" stop-color="#b08b64" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="grain" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" filter="url(#noise)"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#l0)"/>
  <rect width="1600" height="1000" fill="url(#l1)"/>
  <rect width="1600" height="1000" fill="url(#grain)" opacity="0.06" style="mix-blend-mode:multiply"/>
</svg>
