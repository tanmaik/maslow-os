# The terminal as the Talk page shows it: no status bar, since the page
# draws the product's own; every colour a program asks for; the mouse for
# scrolling and for picking a pane; a long scrollback; and no wait after
# Escape. The person's own ~/.tmux.conf comes after and wins.
set -g status off
set -g default-terminal tmux-256color
set -ga terminal-overrides ',xterm-256color:Tc'
set -g mouse on
set -g history-limit 50000
set -s escape-time 10
