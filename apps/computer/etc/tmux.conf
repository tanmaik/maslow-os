# The terminal as the Talk page shows it: no status bar, since the page
# lists the windows itself; every colour a program asks for; the mouse for
# scrolling and for picking a pane; a long scrollback; and no wait after
# Escape. The person's own ~/.tmux.conf comes after and wins.
set -g status off
set -g default-terminal tmux-256color
set -ga terminal-overrides ',xterm-256color:Tc'
set -g mouse on
set -g history-limit 50000
set -s escape-time 10

# Whether the person is looking at this terminal is passed on to what runs
# in it, which otherwise says so and asks for it to be turned on.
set -g focus-events on

# A shell is named for what it holds: the program running in it, or, at a
# bare prompt, the folder it is in, with the home as ~. A name the person
# gave it is theirs, and tmux stops renaming a window once it has one.
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},bash},#{?#{==:#{pane_current_path},/home/me},~,#{b:pane_current_path}},#{pane_current_command}}'

# Words picked here reach the clipboard of the device watching. A terminal
# asks for that with one code, OSC 52, which the page listens for; tmux
# sends it only once told the terminal it speaks to can take it.
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# Picking words with the mouse, as a terminal on a desk does it: drag for
# a run, twice for a word, three times for a line. Letting go copies and
# gives the keyboard back.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -n DoubleClick1Pane select-pane \; copy-mode -H \; send -X select-word \; send -X copy-selection-and-cancel
bind -n TripleClick1Pane select-pane \; copy-mode -H \; send -X select-line \; send -X copy-selection-and-cancel

# A window is drawn for whoever is looking at it, not for every session
# grouped with it, so a second terminal beside the first does not leave
# either padded out with dots it cannot use.
set -g window-size latest
setw -g aggressive-resize on

# A pane opened beside or below this one starts where this one is, and a
# pane closed does not stop to ask.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
# Numbering from one, and closed without gaps, so the terminal a person
# means is the one they count to.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
