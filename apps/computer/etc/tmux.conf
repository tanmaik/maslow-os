# The terminal as the Talk page shows it: no status bar, since the page
# draws the product's own; every colour a program asks for; the mouse for
# scrolling and for picking a pane; a long scrollback; and no wait after
# Escape. The person's own ~/.tmux.conf comes after and wins.
set -g status off
set -g default-terminal tmux-256color
set -ga terminal-overrides ',xterm-256color:Tc'
set -g mouse on
set -g history-limit 50000
set -s escape-time 10

# Words picked here reach the clipboard of the device watching. A terminal
# asks for that with one code, OSC 52, which the page listens for; tmux
# sends it only once told the terminal it speaks to can take it.
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# Picking words with the mouse, as a terminal on a desk does it: drag for
# a run, twice for a word, three times for a line. Letting go copies, and
# what was picked stays lit rather than vanishing under the hand.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-no-clear
bind -n DoubleClick1Pane select-pane \; copy-mode -H \; send -X select-word \; send -X copy-selection-no-clear
bind -n TripleClick1Pane select-pane \; copy-mode -H \; send -X select-line \; send -X copy-selection-no-clear
