<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Welcome</title>
  </head>
  <body>
    <h1 id="greeting">Welcome</h1>
    <p>You are signed in.</p>
    <script>
      const name = new URLSearchParams(location.search).get("name") ?? "friend";
      document.getElementById("greeting").textContent = `Welcome, ${name}`;
    </script>
  </body>
</html>
