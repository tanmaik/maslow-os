<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <h1>Sign in</h1>
    <form id="form">
      <label
        >Email <input name="email" type="email" autocomplete="off"
      /></label>
      <label>Password <input name="password" type="password" /></label>
      <button type="submit">Sign in</button>
    </form>
    <p id="error" hidden>Wrong email or password.</p>
    <script>
      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        if (
          f.get("email") === "pat@example.test" &&
          f.get("password") === "opensesame"
        )
          location.href = "welcome.html?name=Pat";
        else document.getElementById("error").hidden = false;
      });
    </script>
  </body>
</html>
