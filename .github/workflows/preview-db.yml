name: preview-db

# pull_request_target runs main's copy of this file and script with main's
# secrets. The pull request's own code is never checked out here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

# One lifecycle job at a time per pull request; every pull request's own
# database, rows and deployment are keyed by its number.
concurrency:
  group: preview-db-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview-db:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview-db
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STORAGE_ENDPOINT: https://fly.storage.tigris.dev
          STORAGE_REGION: auto
          STORAGE_BUCKET: placeholder-uploads-tigris
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          NEON_PROJECT_ID: quiet-wave-64485699
          NEON_PARENT_BRANCH: preview-parent
          VERCEL_TEAM_ID: team_7NQXOFvUYkNy7L2ztTSnohQ8
          VERCEL_PROJECT_ID: prj_rAZ2iUe98KkFuLsvFc7uwqTh8ko0
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event.action }}" = "closed" ]; then
            node scripts/preview-db.mjs down --pr "$PR"
          else
            node scripts/preview-db.mjs up --pr "$PR" --branch "$REF" --sha "$SHA"
          fi
