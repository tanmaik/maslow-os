name: preview-db

# pull_request_target runs main's copy of this file and script with main's
# secrets. The pull request's own code is never checked out here. The same
# job runs nightly, and by hand, to sweep what a failed close left behind.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# One lifecycle job at a time per pull request, and one sweep at a time;
# every pull request's own database, rows and deployment are keyed by its
# number.
concurrency:
  group: preview-db-${{ github.event.pull_request.number || 'reap' }}
  cancel-in-progress: false

jobs:
  preview-db:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview-db
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Only tokens; where things live is in scripts/ids.mjs.
      - env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "${{ github.event_name }}:${{ github.event.action }}" in
            pull_request_target:closed) node scripts/preview-db.mjs down --pr "$PR" ;;
            pull_request_target:*) node scripts/preview-db.mjs up --pr "$PR" --branch "$REF" --sha "$SHA" ;;
            *) node scripts/preview-db.mjs reap ;;
          esac
