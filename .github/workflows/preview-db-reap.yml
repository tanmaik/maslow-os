name: preview-db-reap

# Nightly sweep for anything a failed close left behind.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-db-reap
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    environment: preview-db
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Only tokens; where things live is in scripts/ids.mjs.
      - env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          FLY_PREVIEW_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/preview-db.mjs reap
