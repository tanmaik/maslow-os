name: sweep-on-deploy
# The moment production is deployed, the sweep runs, so every computer
# moves onto the image the deploy brought without waiting for the hour.
# Runs main's copy of this file with the cron's own secret, held on the
# environment only main can use.
on:
  deployment_status:

permissions:
  contents: read
  deployments: read

concurrency:
  group: sweep-on-deploy
  cancel-in-progress: false

jobs:
  sweep:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    environment: preview-db
    timeout-minutes: 10
    steps:
      # Production's own address, never one the event carries, so the
      # secret goes nowhere else.
      - name: Run the sweep on production
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 600 \
            -H "Authorization: Bearer $CRON_SECRET" https://maslow.tech/meter/sweep
