name: reap-computers

# Every hour, main's copy of the reap, with Fly's token: stops what no
# laptop or preview has wanted for an hour, destroys what none has wanted
# for a day, and takes a disk an hour old that no machine holds.
# Production's app is never touched; it is not this app.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reap-computers
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    environment: preview-db
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: node scripts/reap-computers.mjs
