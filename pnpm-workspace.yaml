packages:
  - apps/*
  # The computer's image installs its own dependencies inside the image;
  # nothing of it runs on a laptop.
  - "!apps/computer"
  - packages/*

# Install scripts are off unless listed. The Postgres packages recreate the
# symlinks npm strips from their library directory, and nothing else.
onlyBuiltDependencies:
  - "@embedded-postgres/darwin-arm64"
  - "@embedded-postgres/darwin-x64"
  - "@embedded-postgres/linux-arm64"
  - "@embedded-postgres/linux-x64"
